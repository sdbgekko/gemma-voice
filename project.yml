name: GemmaVoice
options:
  bundleIdPrefix: com.shermanbrown
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: JKCNSW94H7
    CODE_SIGN_STYLE: Automatic
targets:
  GemmaVoiceWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.2"
    sources:
      - path: WidgetSources
      - path: Shared
    info:
      path: WidgetResources/Info.plist
      properties:
        CFBundleDisplayName: GemmaVoice Widgets
        CFBundleShortVersionString: "0.2.54"
        CFBundleVersion: "29"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        # 0.2.44: the home-screen widget's TimelineProvider polls the
        # voice-turn server's plain-HTTP /health (:9202) — same ATS carve-out
        # the app has always needed for its Tailscale-IP endpoints.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shermanbrown.gemmavoice.widgets
        DEVELOPMENT_TEAM: JKCNSW94H7
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: WidgetResources/Info.plist
        SKIP_INSTALL: "YES"
        CODE_SIGN_STYLE: Automatic
  GemmaVoiceWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: WatchSources
      - path: WatchResources/Assets.xcassets
        buildPhase: resources
    info:
      path: WatchResources/Info.plist
      properties:
        CFBundleDisplayName: GemmaVoice
        CFBundleShortVersionString: "0.2.54"
        CFBundleVersion: "29"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.shermanbrown.gemmavoice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shermanbrown.gemmavoice.watchkitapp
        DEVELOPMENT_TEAM: JKCNSW94H7
        TARGETED_DEVICE_FAMILY: "4"
        ENABLE_PREVIEWS: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: WatchResources/Info.plist
        SUPPORTS_MACCATALYST: "NO"
  GemmaVoice:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Shared
      - path: Resources/Assets.xcassets
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: GemmaVoice
        CFBundleShortVersionString: "0.2.54"
        CFBundleVersion: "29"
        # A4 (2026-08-07): registers the gemmavoice:// scheme so the Live
        # Activity's widgetURL (gemmavoice://open) actually opens the app —
        # handled by .onOpenURL in GemmaVoiceApp.swift.
        CFBundleURLTypes:
          - CFBundleURLName: com.shermanbrown.gemmavoice
            CFBundleURLSchemes:
              - gemmavoice
        # 0.2.43: lets Siri treat "Gemma" as this app's name so the App
        # Shortcut phrases "Talk to Gemma" / "Hey Gemma" resolve naturally
        # (AppShortcut phrases must interpolate .applicationName; this key
        # supplies the synonym). See TalkToGemmaIntent.swift.
        INAlternateAppNames:
          - Gemma
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        UILaunchScreen:
          UIColorName: ""
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: "GemmaVoice needs the microphone to hear you."
        NSSpeechRecognitionUsageDescription: "GemmaVoice uses on-device speech recognition as a fallback when the server transcription is unreachable."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shermanbrown.gemmavoice
        DEVELOPMENT_TEAM: JKCNSW94H7
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: Resources/Info.plist
    dependencies:
      - target: GemmaVoiceWatch
        embed: true
        codeSign: true
      - target: GemmaVoiceWidgets
        embed: true
        codeSign: true
